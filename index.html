<style>

:root{
  --bg-top:#cfc6e0; --bg-bot:#b3a6cf;
  --ink:#241f2e; --ink-soft:#4a4356;
  --paper:#fffdf8; --label-bg:#f4f1ea;
  --bubble:#efeaf3; --bubble-2:#e5dcec;
  --hint-bg:#c9bede; --hint-cell:#e6efce;
  --check:#5a7a2e; --red:#c0392b; --red-deep:#96271b;
  --room-0:#b9a9c9; --room-1:#cdc0dc; --room-2:#a894bb; --room-3:#c3b2d3;
  --room-4:#b0a0c4; --room-5:#c7bad9; --room-6:#ab98c0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot)) fixed;
  color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior-y:contain;
  -webkit-user-select:none;user-select:none;
}
a{color:var(--red-deep)}a:hover{color:var(--red)}
button{font-family:var(--sans)}

/* ================= ESTRUTURA DE ECRÃS ================= */
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.screen{display:none;flex:1;min-height:0;flex-direction:column;padding-top:calc(var(--safe-top) + 10px)}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 14px}
#homeDailyHead{margin-top:0}
.home-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.home-actions .sec-title{flex:1 0 100%;margin:0 2px 1px}

/* ================= TÍTULOS ================= */
.ph{text-align:center;padding:2px 16px 12px;flex:none}
.ph .kicker{font-family:var(--serif);font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft);opacity:.85}
.ph h1{font-family:var(--serif);font-weight:800;font-size:25px;margin:2px 0 0;letter-spacing:.3px}
.sec-title{font-family:var(--serif);font-weight:800;font-size:14px;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:11px;height:11px;background:var(--red);border:2px solid var(--ink);border-radius:3px;flex:none}
.sec-title .muted{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink-soft);margin-left:auto}

/* ================= CARTÕES ================= */
.card2{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 rgba(36,31,46,.24);padding:12px 14px}
.card2.hi{border-width:3px;border-radius:16px;box-shadow:4px 5px 0 rgba(36,31,46,.3);position:relative}
.tagnew{position:absolute;top:-11px;right:14px;background:var(--red);color:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:800;font-size:10px;letter-spacing:1px}
.eyebrow{font-family:var(--serif);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-soft)}
.card2 h2{font-family:var(--serif);font-weight:800;font-size:21px;margin:3px 0 4px}
.blurb{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.45;color:var(--ink-soft);text-wrap:pretty}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 0;justify-content:center}
.chip{background:var(--label-bg);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:700;font-size:10.5px}
.chip.on{background:var(--hint-bg)}

/* ================= BOTÕES ================= */
.btn{
  flex:1;border:3px solid var(--ink);border-radius:12px;padding:13px 8px;font-size:14px;font-weight:800;
  cursor:pointer;letter-spacing:.3px;background:var(--paper);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.accuse{background:var(--red);color:#fff;flex:1.5}
.btn.accuse:disabled{background:#b7b0bf;color:#efeaf3;cursor:not-allowed;box-shadow:3px 3px 0 var(--ink-soft);border-color:var(--ink-soft);transform:none}
.btn.hintb{flex:.62;font-size:17px}
.btn.danger{background:var(--paper);color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.btn.danger:active{box-shadow:0 0 0 var(--red)}
.row{display:flex;gap:9px}
.icon{
  width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);
  color:var(--ink);font-size:15px;display:grid;place-items:center;cursor:pointer;font-weight:800;flex:none;
  box-shadow:2px 2px 0 var(--ink);
}
.icon:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* ================= INÍCIO ================= */
.levels3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl3{border:2px solid var(--ink);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;box-shadow:2px 2px 0 var(--ink);background:var(--paper)}
.lvl3:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.lvl3.cur{background:var(--hint-bg)}
.lvl3 .b{width:26px;height:26px;border-radius:8px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin:0 auto 5px}
.lvl3 .t{font-family:var(--serif);font-weight:800;font-size:12.5px}
.lvl3 .d{font-size:10px;color:var(--ink-soft)}
.stats3{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--bubble);border:2px solid var(--ink);border-radius:12px;padding:9px 4px;text-align:center}
.stat.paper{background:var(--paper);box-shadow:2px 2px 0 rgba(36,31,46,.24)}
.stat .v{font-family:var(--serif);font-weight:800;font-size:19px}
.stat .v.red{color:var(--red)}
.stat .l{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
.resume{display:flex;align-items:center;gap:12px;cursor:pointer}
.resume .mini{width:44px;height:44px;border:2px solid var(--ink);border-radius:9px;background:var(--bubble);display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;padding:4px;flex:none}
.resume .mini i{background:var(--room-0);border-radius:1px}
.resume .mini i.k{background:var(--ink)}
.resume .rtag{font-weight:800;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--red-deep);margin-bottom:2px}
.resume .nm{font-family:var(--serif);font-weight:800;font-size:14px}
.resume .sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.bar-pg{height:6px;background:var(--bubble-2);border:1.5px solid var(--ink);border-radius:4px;margin-top:6px;overflow:hidden}
.bar-pg i{display:block;height:100%;background:var(--check)}

/* ================= DIÁRIO ================= */
.daily{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.streak7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.streak7 .d{text-align:center}
.streak7 .box{aspect-ratio:1;border:2px solid var(--ink);border-radius:7px;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:13px}
.streak7 .box.ok{background:var(--hint-cell);color:var(--check)}
.streak7 .box.miss{background:#f4dcd8;color:var(--red)}
.streak7 .box.today{border:2.5px dashed var(--red);background:var(--paper)}
.streak7 .lb{font-size:9px;color:var(--ink-soft);margin-top:3px}
.streak7 .lb.hoje{font-weight:800;color:var(--red)}

/* ================= CABEÇALHO DO TABULEIRO ================= */
.bhead{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 8px}
.bhead .mid{flex:1;text-align:center;min-width:0}
.bhead .k{font-family:var(--serif);font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-soft)}
.bhead h1{font-family:var(--serif);font-weight:800;font-size:17px;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{background:var(--ink);color:var(--paper);border-radius:10px;padding:6px 9px;font-weight:800;font-size:13px;font-family:ui-monospace,Menlo,monospace;flex:none;min-width:56px;text-align:center}
.clock.off{display:none}

/* ================= GRELHA / CENA ================= */
.scene{
  background:var(--paper);border:4px solid var(--ink);border-radius:6px;
  width:min(calc(100% - 28px),48vh);margin:0 auto;
  box-shadow:5px 6px 0 rgba(36,31,46,.25);position:relative;overflow:hidden;flex:none;
}
.grid{display:grid;position:relative}
.gcell{position:relative;aspect-ratio:1;border:1px solid rgba(36,31,46,.28);display:grid;place-items:center;overflow:hidden}
.gcell.wtop{border-top:3px solid var(--ink)}
.gcell.wbot{border-bottom:3px solid var(--ink)}
.gcell.wleft{border-left:3px solid var(--ink)}
.gcell.wright{border-right:3px solid var(--ink)}
.gcell svg.furn,.gcell img.furn{width:74%;height:74%;pointer-events:none}
.gcell.occ{cursor:pointer}
.gcell.blocked{cursor:default}
.gcell.selectable::after{content:"";position:absolute;inset:3px;border:2px dashed var(--red);border-radius:6px;opacity:.9;animation:dash 1s linear infinite;z-index:3}
@keyframes dash{to{transform:scale(1.04);opacity:.5}}
.roomlabel{
  position:absolute;z-index:4;font-family:var(--serif);font-weight:700;font-size:10px;letter-spacing:.4px;
  background:var(--label-bg);border:2px solid var(--ink);border-radius:14px;padding:2px 8px;
  box-shadow:2px 2px 0 rgba(36,31,46,.3);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;
}
.pawn{
  position:absolute;z-index:7;width:72%;height:72%;border-radius:50%;
  display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--paper);
  border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(36,31,46,.35);
  animation:plop .26s cubic-bezier(.2,1.4,.4,1);
}
@keyframes plop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.victim-mark{position:absolute;z-index:8;width:80%;height:80%;pointer-events:none}
.gcell.victim-cell{box-shadow:inset 0 0 0 3px var(--red)}
.gcell.reveal{animation:reveal 1s ease infinite;box-shadow:inset 0 0 0 3px var(--red)}
@keyframes reveal{50%{box-shadow:inset 0 0 0 5px var(--red)}}
.win{position:absolute;background:#cfe4f0;border:2px solid var(--ink);border-radius:2px;z-index:6;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
.win.h{height:7px;left:18%;width:64%}
.win.v{width:7px;top:18%;height:64%}
.win.top{top:-4px}.win.bottom{bottom:-4px}.win.left{left:-4px}.win.right{right:-4px}
.victim-reveal{animation:vpop .5s cubic-bezier(.2,1.5,.3,1)}
@keyframes vpop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}

/* ================= TIRA DE SUSPEITOS ================= */
.strip{flex:none;display:flex;gap:9px;padding:11px 14px 7px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pol{
  width:66px;flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:4px 4px 2px;
  box-shadow:3px 3px 0 rgba(36,31,46,.28);cursor:pointer;transition:transform .12s;transform:rotate(var(--tilt,0deg));
}
.pol:active{transform:rotate(var(--tilt,0deg)) scale(.95)}
.pol .photo{width:100%;aspect-ratio:1/1;overflow:hidden;background:#5b4a63;position:relative;display:block}
.pol .photo svg{width:100%;height:100%;display:block}
.pol .nm{font-family:var(--serif);font-style:italic;font-weight:700;font-size:11px;text-align:center;padding:3px 0 1px}
.pol.placed{opacity:.42}
.pol.active{outline:3px solid var(--red);outline-offset:2px}
.pol.victim{border-color:var(--red);cursor:default}
.pol.victim .nm{color:var(--red-deep)}

/* ================= DEPOIMENTOS COMPACTOS ================= */
.clues{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 0;-webkit-overflow-scrolling:touch}
.cl{
  background:var(--bubble);border-radius:12px;padding:8px 11px;cursor:pointer;display:flex;gap:9px;
  align-items:flex-start;box-shadow:2px 2px 4px rgba(36,31,46,.1);margin-bottom:6px;
}
.cl .av{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);color:var(--paper);font-weight:800;font-size:10px;display:grid;place-items:center;flex:none;margin-top:1px}
.cl .tx{flex:1;min-width:0;font-size:12px;line-height:1.42;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .tx b{font-weight:800}
.cl.open .tx{white-space:normal}
.cl .cv{font-weight:800;font-size:12px;color:var(--ink-soft);flex:none}
.cl.vic{background:#f0e2e2}
.cl.vic .vtag{font-weight:800;color:var(--red-deep);display:block;margin-bottom:1px}
.cl.hint{background:var(--hint-bg);box-shadow:2px 2px 0 rgba(36,31,46,.25)}
.cl.hint .av{background:var(--ink)}

/* ================= BARRA DE AÇÕES ================= */
.bar{flex:none;padding:10px 14px calc(var(--safe-bot) + 14px);background:linear-gradient(180deg,rgba(179,166,207,0),var(--bg-bot) 40%)}
.bar .row{max-width:600px;margin:0 auto}

/* ================= TABS ================= */
.tabs{
  flex:none;background:var(--paper);border-top:3px solid var(--ink);
  padding:8px 6px calc(var(--safe-bot) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-soft);cursor:pointer;background:none;border:0;padding:2px 0;font-size:9.5px}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--red)}
.tab.on span{font-weight:800}

/* ================= REGISTO ================= */
.tbar{display:flex;flex-direction:column;gap:8px}
.tline{display:flex;align-items:center;gap:9px}
.tline .lb{width:44px;font-weight:700;font-size:11px;flex:none}
.tline .tr{flex:1;height:16px;background:var(--bubble-2);border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.tline .tr i{display:block;height:100%}
.tline .vl{width:42px;text-align:right;font-weight:800;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;flex:none}
.days14{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.days14 i{aspect-ratio:1;border-radius:3px;background:var(--bubble-2)}
.days14 i.ok{background:var(--check)}
.days14 i.no{background:var(--red)}
.days14 i.today{background:transparent;border:2px dashed var(--red)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:9px 5px;text-align:center;box-shadow:2px 2px 0 rgba(36,31,46,.24)}
.ach .ic{width:34px;height:34px;margin:0 auto 4px;border:2px solid var(--ink);border-radius:50%;background:var(--hint-bg);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:14px}
.ach .t{font-weight:700;font-size:9.5px;line-height:1.25}
.ach .ad{display:none}
.ach.lock{background:rgba(255,253,248,.4);border:2px dashed rgba(36,31,46,.35);box-shadow:none}
.ach.lock .ic{border-color:rgba(36,31,46,.35);background:transparent;color:rgba(36,31,46,.4)}
.ach.lock .t{color:rgba(36,31,46,.45)}

/* ================= ARQUIVO ================= */
.filters{display:flex;gap:7px;margin-bottom:10px}
.filt{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:700;font-size:11px;cursor:pointer}
.filt.on{background:var(--ink);color:var(--paper)}
.arow{background:var(--paper);border:2px solid var(--ink);border-radius:13px;padding:10px 12px;box-shadow:2px 2px 0 rgba(36,31,46,.24);display:flex;align-items:center;gap:11px;margin-bottom:8px}
.arow .mk{width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.arow .mk.ok{background:var(--hint-cell);color:var(--check)}
.arow .mk.no{background:#f4dcd8;color:var(--red)}
.arow .nm{font-family:var(--serif);font-weight:800;font-size:13.5px}
.arow .sub{font-size:11px;color:var(--ink-soft)}
.arow .tm{font-weight:800;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;flex:none}
.empty{text-align:center;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-soft);padding:28px 10px}

/* ================= AJUSTES ================= */
.list{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 rgba(36,31,46,.22);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1.5px solid rgba(36,31,46,.15);cursor:pointer}
.li:last-child{border-bottom:0}
.li .g{flex:1}
.li .t{font-family:var(--serif);font-weight:800;font-size:13px}
.li .d{font-size:11px;color:var(--ink-soft)}
.li .val{font-weight:700;font-size:12px;color:var(--ink-soft)}
.li.muted-li{cursor:default;opacity:.62}
.sw{width:48px;height:28px;border:2px solid var(--ink);border-radius:16px;flex:none;padding:2px;display:flex;background:var(--hint-bg);justify-content:flex-start;transition:background .15s,justify-content .15s}
.sw i{width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transition:transform .15s}
.sw.on{background:var(--check);justify-content:flex-end}
.dailyrow{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;margin-top:12px}
.dailyrow .pol{width:118px;flex:none}
.dailyrow .pol .nm{font-size:13.5px}
.dailytx{max-width:290px}
.dailytx .vtag{font-weight:800;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-deep);margin-bottom:3px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.lang{border:2px solid rgba(36,31,46,.4);border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:9px;cursor:pointer;background:var(--paper)}
.lang .fl{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:12px;border:2px solid var(--ink);border-radius:6px;padding:2px 6px;background:var(--label-bg);flex:none}
.lang .ln{font-family:var(--serif);font-weight:700;font-size:13px}
.lang.cur{border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);background:var(--hint-bg)}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.pal{border:2px solid rgba(36,31,46,.4);border-radius:10px;overflow:hidden;cursor:pointer}
.pal .sw2{height:26px}
.pal .nm{font-size:9.5px;text-align:center;padding:3px 0;background:var(--label-bg)}
.pal.cur{border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.pal.cur .nm{font-weight:700}
.ver{text-align:center;font-family:var(--serif);font-style:italic;font-size:11px;color:var(--ink-soft);padding:14px 0 4px}

/* ================= MODAIS ================= */
.veil{position:fixed;inset:0;z-index:60;background:rgba(36,31,46,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:20px}
.veil.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:20px 18px;width:100%;max-width:420px;
  box-shadow:6px 7px 0 rgba(36,31,46,.4);max-height:86vh;overflow-y:auto;animation:rise .28s cubic-bezier(.2,1.1,.3,1)
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-family:var(--serif);font-weight:800;font-size:20px;margin:0 0 6px}
.modal h4{font-family:var(--serif);font-size:14px;margin:15px 0 6px}
.modal h4:first-child{margin-top:2px}
.modal p{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 12px;text-wrap:pretty}
.modal p b{color:var(--ink)}
.modal ul{margin:0 0 10px;padding-left:18px}
.modal li{font-size:12.5px;line-height:1.55;margin-bottom:5px;color:var(--ink-soft)}
.modal li b{color:var(--ink)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.pick{border:2px solid var(--ink);border-radius:10px;padding:7px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--paper)}
.pick .av{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.pick .nm{font-family:var(--serif);font-style:italic;font-weight:700;font-size:14px}
.pick.sel{background:#fdece9;border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.stampmark{text-align:center;padding:6px 0 14px;position:relative;z-index:2;font-family:var(--serif);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:2px}
.stampmark .ring{display:inline-block;padding:5px 18px;border:4px double currentColor;border-radius:8px;transform:rotate(-5deg);animation:slam .4s cubic-bezier(.2,1.6,.3,1)}
.stampmark.ok{color:var(--red)}
.stampmark.no{color:var(--ink-soft);font-size:24px}
@keyframes slam{0%{transform:rotate(-5deg) scale(2.2);opacity:0}60%{transform:rotate(-5deg) scale(.92)}100%{transform:rotate(-5deg) scale(1)}}
.resfoto{display:flex;justify-content:center;gap:14px;margin-bottom:12px}
.resfoto .pol{width:130px;cursor:default;transform:rotate(2deg)}
.resfoto .pol.acc{transform:rotate(-3deg);filter:saturate(.55)}
.resfoto .pol .tag{font-weight:800;font-size:9px;letter-spacing:1px;text-align:center;color:var(--ink-soft);padding-bottom:2px}
.resfoto .pol.guilty{border-color:var(--red);box-shadow:3px 4px 0 rgba(192,57,43,.35)}
.resfoto .pol.guilty .tag{color:var(--red)}
.newach{background:var(--hint-bg);border:2px solid var(--ink);border-radius:14px;padding:11px 13px;display:flex;gap:11px;align-items:center;box-shadow:3px 3px 0 rgba(36,31,46,.25);margin-bottom:12px}
.newach .ic{width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:15px;flex:none}
.newach .t{font-family:var(--serif);font-weight:800;font-size:13px}
.newach .d{font-size:11.5px;color:var(--ink-soft)}
.objlist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:6px 0 12px}
.objcard{background:#fff;border:2px solid var(--ink);border-radius:9px;padding:7px 4px;text-align:center}
.objcard.yes{background:var(--hint-cell)}
.objcard.no{background:#f4dcd8}
.objcard svg,.objcard img{width:34px;height:34px;display:block;margin:0 auto 3px;object-fit:contain}
.objcard span{font-size:10.5px;font-weight:700}
.rulebox{background:var(--hint-bg);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:12.5px;line-height:1.5}
.rulebox b{color:var(--red-deep)}
.tip{background:#e8e0f0;border-left:4px solid var(--ink);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:8px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.tip b{color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:9px;margin:6px 0 4px}
.lvl{border:2px solid var(--ink);border-radius:11px;padding:11px 14px;cursor:pointer;background:var(--paper);display:flex;align-items:center;gap:12px;box-shadow:2px 2px 0 var(--ink)}
.lvl:active{transform:translate(2px,2px);box-shadow:0 0 0}
.lvl .badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.lvl .lt{font-family:var(--serif);font-weight:800;font-size:15px}
.lvl .ld{font-size:11.5px;color:var(--ink-soft)}
.lvl.cur{background:#f3eef8;border-width:3px}

/* ================= TOAST + INTRO ================= */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 96px);transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);border-radius:11px;padding:10px 16px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:.24s;max-width:86%;text-align:center;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.intro{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;transition:opacity .5s}
.intro.gone{opacity:0;pointer-events:none}
.intro .badge{width:112px;height:112px;margin-bottom:8px}
.intro h1{font-family:var(--serif);font-weight:800;font-size:42px;margin:4px 0 2px;letter-spacing:1px}
.intro .tag{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--ink-soft);max-width:300px;line-height:1.5;margin-bottom:24px}
.counter{font-family:var(--serif);font-size:12px;color:var(--ink-soft);margin-top:14px}

/* ================= DESKTOP ================= */
.gcell.dragover::after{content:"";position:absolute;inset:2px;border:3px solid var(--red);border-radius:5px;z-index:9;pointer-events:none}
#tabs6{display:none}
@media(min-width:900px){
  .app{max-width:none}
  .screen{padding-top:0}
  .screen.on{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .screen>.tabs{grid-row:1/3;grid-column:1}
  .screen>.ph{grid-column:2;padding:30px 24px 16px}
  .screen>.scroll{grid-column:2;width:100%;max-width:780px;justify-self:center;padding:0 24px 32px}

  /* barra lateral */
  #tabs6{display:grid}
  .tabs{
    border-top:0;border-right:3px solid var(--ink);align-content:start;gap:5px;
    grid-template-columns:1fr;padding:26px 12px;
  }
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 13px;border-radius:12px;font-size:13.5px}
  .tab svg{width:22px;height:22px;flex:none}
  .tab:hover{background:var(--bubble)}
  .tab.on{background:var(--hint-bg);color:var(--red)}
  .tab.on span{font-weight:800}

  /* tabuleiro à esquerda, tudo empilhado à direita */
  #scr-board.on{
    grid-template-columns:236px minmax(300px,1.3fr) minmax(320px,0.7fr);
    grid-template-rows:auto auto minmax(0,1fr) auto;
  }
  #scr-board>.tabs{grid-row:1/5;grid-column:1}
  #scr-board>.bhead{grid-column:2/4;grid-row:1;padding:26px 26px 14px}
  #scr-board>.bhead #backBtn{display:none}
  #scr-board>.bhead .mid{text-align:left}
  #scr-board>.bhead h1{font-size:24px}
  #scr-board>.bhead .k{font-size:10.5px}
  #scr-board>.clock{font-size:15px;padding:8px 12px}
  #scr-board>.scene{grid-column:2;grid-row:2/5;align-self:start;justify-self:center;width:min(100% - 36px,72vh);margin:0}
  #scr-board>.strip{grid-column:3;grid-row:2;flex-wrap:wrap;overflow:visible;padding:0 26px 10px;row-gap:12px}
  #scr-board>.clues{grid-column:3;grid-row:3;padding:0 26px}
  #scr-board>.bar{grid-column:3;grid-row:4;background:none;padding:12px 26px 26px}

  /* no desktop há largura para mostrar os depoimentos por inteiro */
  .cl{cursor:default}
  .cl .tx{white-space:normal;font-size:12.5px}
  .cl .cv{display:none}
  .pol{width:74px}
  .pol:hover{transform:rotate(var(--tilt,0deg)) translateY(-3px)}
  .pol.victim:hover{transform:rotate(var(--tilt,0deg))}

  /* duas colunas onde os blocos são autónomos */
  #setBody,#statsBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
  #setBody>*,#statsBody>*{margin-top:0!important}
  #setBody .sec-title,#setBody .row,#statsBody .sec-title,#statsBody .stats3,#statsBody .achs{grid-column:1/-1}
  .achs{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
  .ach{padding:14px 11px 12px}
  .ach .ic{width:42px;height:42px;font-size:17px;margin-bottom:7px}
  .ach .t{font-size:12px}
  .ach .ad{display:block;font-size:10.5px;line-height:1.35;color:var(--ink-soft);margin-top:4px;text-wrap:pretty}
  .ach.lock .ad{color:rgba(36,31,46,.38)}
  #statsBody .stat .v{font-size:26px}
  #statsBody .stat .l{font-size:10px}
  #archList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  #archList .arow{margin-bottom:0}
  .btn:hover{filter:brightness(1.06)}
  .lvl:hover,.pal:hover,.lang:hover,.filt:hover{filter:brightness(.97)}
  .intro .badge{width:132px;height:132px}
  .intro h1{font-size:52px}
}
@media(min-width:1400px){
  #scr-board.on{grid-template-columns:236px minmax(300px,1.15fr) minmax(380px,0.85fr)}
}

@media(max-height:700px){
  .ph h1{font-size:22px}
  .card2 h2{font-size:19px}
  .cl .tx{font-size:11.5px}
  .pol{width:60px}
}

/* === Regras funcionais preservadas do Mysterioku (contas/paywall) === */
.acctbar{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}

.acctbar .accinfo{width:100%;text-align:center;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctbar .acctrow{display:flex;gap:8px;align-items:center;justify-content:center}

.acctbar .accinfo b{color:var(--red)}

.acctbar .acctbtn{flex:none;padding:8px 14px;font-size:12.5px}


  
  .sheet{max-width:460px}
</style>
</head>

function mulberry32(seed){return function(){seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Mapa: para cada tema, o sprite de cada nome de alvo (por índice do array names)
const TMAP={
  homicidio:["person","person","person","person","person","person","person","person","person","person"],
  espionagem:["doc","doc","film","safe_data","doc","doc","doc","key"],
  roubo:["safe","safe","money","jewel","money","safe","safe","chest"],
  arte:["painting","painting","statue","painting","relic","relic","vase","relic"],
  fantasma:["ghost","ghost","ghost","ghost","ghost","ghost","ghost","ghost"],
};
// devolve a data-URL do sprite do alvo para o caso atual
function targetSprite(theme,idx){
  const arr=TMAP[theme.key]||["person"];
  return TSPRITE[arr[idx%arr.length]]||TSPRITE.person;
}
// HTML do sprite do alvo (imagem), para usar no cartão/reveal/resultado
function targetImg(theme,idx,cls){
  return '<img class="'+(cls||"tsprite")+'" src="'+targetSprite(theme,idx)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
}

function pickTheme(seed){return CASE_THEMES[Math.abs(seed)%CASE_THEMES.length];}
// Nome do alvo por idioma (homicidio usa nomes de pessoas iguais nos dois idiomas)
function themeName(theme,idx){ const arr=(LANG==="en"&&theme.namesEN)?theme.namesEN:theme.names; return arr[idx%arr.length]; }
function victimName(){ return themeName(G._theme,G._victimIdx||0); }
function themeIntro(){ return tr(G._theme.intros[G._introIdx||0]).replace(/{T}/g,victimName()); }

/* ---------- geometria ---------- */
function besideCells(L,r,c){
  const o=[],d=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of d){const nr=r+dr,nc=c+dc;
    if(nr<0||nc<0||nr>=L.G||nc>=L.G)continue;
    if(L.a[nr][nc]!==L.a[r][c])continue;      // mesma divisão (regra oficial)
    o.push([nr,nc]);}
  return o;
}
function besideObjects(L,r,c){const s=new Set();for(const[nr,nc]of besideCells(L,r,c)){const t=L.t[nr][nc];if(isBlock(t))s.add(t);}return s;}
function windowCells(w,G){const o=[[w.r,w.c]];if(w.side==="top"&&w.r>0)o.push([w.r-1,w.c]);if(w.side==="left"&&w.c>0)o.push([w.r,w.c-1]);return o;}
function cellHasWindow(L,r,c){return L.windows.some(w=>windowCells(w,L.G).some(([a,b])=>a===r&&b===c));}
function ordF(n){
  if(LANG==="en"){const w=["","first","second","third","fourth","fifth","sixth","seventh"];return w[n]||(n+"th");}
  const w=["","primeira","segunda","terceira","quarta","quinta","sexta","sétima"];return w[n]||(n+"ª");
}

/* ---------- divisões e objetos ---------- */
function buildRooms(G,n,rnd){
  const a=Array.from({length:G},()=>Array(G).fill(-1)),all=[];
  for(let r=0;r<G;r++)for(let c=0;c<G;c++)all.push([r,c]);
  shuffle(all,rnd);
  let f=[];for(let i=0;i<n;i++){const[r,c]=all[i];a[r][c]=i;f.push([r,c,i]);}
  while(f.length){shuffle(f,rnd);const nx=[];
    for(const[r,c,id]of f){const nb=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];shuffle(nb,rnd);
      for(const[nr,nc]of nb){if(nr<0||nc<0||nr>=G||nc>=G)continue;if(a[nr][nc]===-1){a[nr][nc]=id;nx.push([nr,nc,id]);}}}
    f=nx;}
  const cnt=Array(n).fill(0);for(let r=0;r<G;r++)for(let c=0;c<G;c++)cnt[a[r][c]]++;
  return cnt.some(x=>x<2)?null:a;
}
function rowFree(t,G,r){for(let c=0;c<G;c++)if(t[r][c]===null||isOcc(t[r][c]))return true;return false;}
function colFree(t,G,c){for(let r=0;r<G;r++)if(t[r][c]===null||isOcc(t[r][c]))return true;return false;}
function placeObjects(G,a,theme,rnd,order){
  const t=Array.from({length:G},()=>Array(G).fill(null)),cells=[];
  for(let r=0;r<G;r++)for(let c=0;c<G;c++)cells.push([r,c]);
  shuffle(cells,rnd);
  const zones=theme.zones||{};
  // a[r][c] é o índice de região (0..nRooms-1); order[] mapeia-o ao índice
  // original da divisão no tema, que é o que as zonas usam.
  const roomOf=(r,c)=> order?order[a[r][c]]:a[r][c];
  const allowed=(type,r,c)=>{const z=zones[type];return !z||z.indexOf(roomOf(r,c))>=0;};

  const budget=[];
  for(const k in theme.blocks){const[mn,mx]=theme.blocks[k];const n=mn+Math.floor(rnd()*(mx-mn+1));for(let i=0;i<n;i++)budget.push(k);}
  shuffle(budget,rnd);
  const maxB=Math.floor(G*G*0.4);let placed=0;
  for(const b of budget){
    if(placed>=maxB)break;
    for(const[r,c]of cells){
      if(t[r][c])continue;
      if(!allowed(b,r,c))continue;              // respeita a zona do móvel
      t[r][c]=b;
      if(rowFree(t,G,r)&&colFree(t,G,c)){placed++;break;}
      t[r][c]=null;
    }
  }
  // Ocupáveis: mistura ponderada, mas também respeitando zonas (ex.: cama só no quarto)
  const mix=[];for(const k in theme.occ){const w=Math.round(theme.occ[k]*100);for(let i=0;i<w;i++)mix.push(k);}
  const rest=[];for(let r=0;r<G;r++)for(let c=0;c<G;c++)if(!t[r][c])rest.push([r,c]);
  shuffle(rest,rnd);
  const nObj=Math.floor(rest.length*(theme.objDensity==null?0.45:theme.objDensity));
  for(let i=0;i<rest.length;i++){
    const[r,c]=rest[i];
    if(i<nObj&&mix.length){
      // tenta um ocupável permitido nesta divisão; se nenhum servir, deixa vazio
      const opts=mix.filter(m=>allowed(m,r,c));
      t[r][c]=opts.length?pick(opts,rnd):".";
    }else t[r][c]=".";
  }
  return t;
}
function buildWindows(G,a,rnd,count){
  const e=[];
  for(let r=0;r<G;r++)for(let c=0;c<G;c++){
    if(r===0||a[r-1][c]!==a[r][c])e.push({r,c,side:"top"});
    if(c===0||a[r][c-1]!==a[r][c])e.push({r,c,side:"left"});
  }
  for(let c=0;c<G;c++)e.push({r:G-1,c,side:"bottom"});
  for(let r=0;r<G;r++)e.push({r,c:G-1,side:"right"});
  shuffle(e,rnd);return e.slice(0,count);
}

/* ---------- SOLVER (regras oficiais) ---------- */
function solve(L,cells,cons,S,limit){
  limit=limit||2;
  const G=L.G,assign=new Array(S).fill(-1),uR=new Set(),uC=new Set(),uCell=new Set(),sols=[];
  function finish(){
    let fr=-1,fc=-1;
    for(let r=0;r<G;r++)if(!uR.has(r)){if(fr>=0)return null;fr=r;}
    for(let c=0;c<G;c++)if(!uC.has(c)){if(fc>=0)return null;fc=c;}
    if(fr<0||fc<0)return null;
    if(!isOcc(L.t[fr][fc]))return null;          // vítima na última célula DISPONÍVEL
    const vA=L.a[fr][fc];let n=0;
    for(let p=0;p<S;p++){const[r,c]=cells[assign[p]];if(L.a[r][c]===vA)n++;}
    if(n!==1)return null;                        // sozinho com a vítima
    return [fr,fc];
  }
  function bt(p){
    if(sols.length>=limit)return;
    if(p===S){
      for(const k of cons)if(k.test(assign,cells,L)===false)return;
      const v=finish();if(!v)return;
      sols.push({assign:assign.slice(),victim:v});return;
    }
    for(let ci=0;ci<cells.length;ci++){
      if(uCell.has(ci))continue;
      const[r,c]=cells[ci];
      if(uR.has(r)||uC.has(c))continue;
      assign[p]=ci;uR.add(r);uC.add(c);uCell.add(ci);
      let ok=true;
      for(const k of cons){if(k.p===p||k.pair){if(k.test(assign,cells,L)===false){ok=false;break;}}}
      if(ok)bt(p+1);
      assign[p]=-1;uR.delete(r);uC.delete(c);uCell.delete(ci);
    }
  }
  bt(0);return sols;
}

/* ---------- PISTAS ---------- */
function buildClues(L,cells,sol,rnd,level){
  const S=sol.length,clues=[],pos=p=>cells[sol[p]];
  for(let p=0;p<S;p++){
    const[r,c]=pos(p),area=L.a[r][c],obj=L.t[r][c];
    clues.push({p,kind:"area",test:a=>a[p]<0?undefined:L.a[cells[a[p]][0]][cells[a[p]][1]]===area,text:nm=>roomPhrase(nm[p],L.rooms[area])});
    clues.push({p,kind:"row",test:a=>a[p]<0?undefined:cells[a[p]][0]===r,text:nm=>rowPhrase(nm[p],r+1)});
    clues.push({p,kind:"col",test:a=>a[p]<0?undefined:cells[a[p]][1]===c,text:nm=>colPhrase(nm[p],c+1)});
    if(obj!==".")clues.push({p,kind:"on",test:a=>a[p]<0?undefined:L.t[cells[a[p]][0]][cells[a[p]][1]]===obj,text:nm=>CLUE.on(nm[p],obj)});
    if(level>=2)for(const o of OCC_OBJ){if(o!==obj&&L.t.some(row=>row.indexOf(o)>=0))
      clues.push({p,kind:"on-",test:a=>a[p]<0?undefined:L.t[cells[a[p]][0]][cells[a[p]][1]]!==o,text:nm=>CLUE.onNot(nm[p],o)});}
    const bs=besideObjects(L,r,c);
    for(const f of bs)clues.push({p,kind:"beside",test:a=>a[p]<0?undefined:besideObjects(L,cells[a[p]][0],cells[a[p]][1]).has(f),text:nm=>CLUE.beside(nm[p],f)});
    if(level>=2)for(const f of BLOCK){if(!bs.has(f)&&L.t.some(row=>row.indexOf(f)>=0))
      clues.push({p,kind:"beside-",test:a=>a[p]<0?undefined:!besideObjects(L,cells[a[p]][0],cells[a[p]][1]).has(f),text:nm=>CLUE.besideNot(nm[p],f)});}
    if(cellHasWindow(L,r,c))clues.push({p,kind:"window",test:a=>a[p]<0?undefined:cellHasWindow(L,cells[a[p]][0],cells[a[p]][1]),text:nm=>CLUE.window(nm[p])});
    else if(level>=2&&L.windows.length)clues.push({p,kind:"window-",test:a=>a[p]<0?undefined:!cellHasWindow(L,cells[a[p]][0],cells[a[p]][1]),text:nm=>CLUE.windowNot(nm[p])});
    if(level>=2)for(let q=0;q<S;q++){
      if(q===p)continue;const[qr,qc]=pos(q),rels=[];
      if(r<qr)rels.push(["N",a=>cells[a[p]][0]<cells[a[q]][0]]);
      if(r>qr)rels.push(["S",a=>cells[a[p]][0]>cells[a[q]][0]]);
      if(c<qc)rels.push(["W",a=>cells[a[p]][1]<cells[a[q]][1]]);
      if(c>qc)rels.push(["E",a=>cells[a[p]][1]>cells[a[q]][1]]);
      if(rels.length){const[d,fn]=pick(rels,rnd);
        clues.push({p,pair:[p,q],kind:"card",test:a=>(a[p]<0||a[q]<0)?undefined:fn(a),text:nm=>CLUE.card(nm[p],DIRW[LANG][d],nm[q])});}
    }
  }
  return shuffle(clues,rnd);
}
// Frases dependentes de sala/fila/coluna, bilingues
function roomPhrase(nm,room){ const rn=tr(room.name); return LANG==="en" ? nm+" was "+rn+"." : nm+" estava "+rn+"."; }
function rowPhrase(nm,n){ return LANG==="en" ? nm+" was in the "+ordF(n)+" row." : nm+" estava na "+ordF(n)+" fila."; }
function colPhrase(nm,n){ return LANG==="en" ? nm+" was in the "+ordF(n)+" column." : nm+" estava na "+ordF(n)+" coluna."; }

/* ---------- GERADOR ---------- */
function gridForLevel(level,rnd){const R={1:[4,4],2:[5,5],3:[5,6]}[level]||[5,5];return R[0]+Math.floor(rnd()*(R[1]-R[0]+1));}
function generate(seed,opts){
  opts=opts||{};const level=opts.level||1;let depth=opts._d||0;
  if(depth>150){seed=(seed*7+11)|0;depth=0;}
  const rnd=mulberry32(seed);
  const theme=THEMES[(opts.themeIdx==null?Math.floor(mulberry32(seed+3)()*THEMES.length):opts.themeIdx)%THEMES.length];
  const G=opts.grid||gridForLevel(level,mulberry32(seed+9));
  const S=G-1;
  const nRooms=Math.max(2,Math.min(theme.rooms.length,Math.round(G*0.7)));
  let a=null;for(let i=0;i<30&&!a;i++)a=buildRooms(G,nRooms,mulberry32(seed+i*17));
  if(!a)return generate(seed+1,Object.assign({},opts,{_d:depth+1}));
  const order=shuffle([...theme.rooms.keys()],mulberry32(seed+31)).slice(0,nRooms);
  const t=placeObjects(G,a,theme,mulberry32(seed+555),order);
  const windows=buildWindows(G,a,mulberry32(seed+777),1+Math.floor(mulberry32(seed+13)()*2));
  const rooms=order.map(i=>({name:{pt:theme.rooms[i],en:(theme.roomsEN?theme.roomsEN[i]:theme.rooms[i])},short:{pt:theme.shorts[i],en:(theme.shortsEN?theme.shortsEN[i]:theme.shorts[i])}}));
  const L={G,a,t,windows,rooms,theme:theme.id,name:{pt:theme.title,en:(theme.titleEN||theme.title)}};
  const cells=[];for(let r=0;r<G;r++)for(let c=0;c<G;c++)if(isOcc(t[r][c]))cells.push([r,c]);
  if(cells.length<G)return generate(seed+1,Object.assign({},opts,{_d:depth+1}));
  const all=solve(L,cells,[],S,300);
  if(!all.length)return generate(seed+1,Object.assign({},opts,{_d:depth+1}));
  const chosenSol=pick(all,rnd),sol=chosenSol.assign,victim=chosenSol.victim;
  const vA=L.a[victim[0]][victim[1]];
  const killer=sol.findIndex(ci=>{const[r,c]=cells[ci];return L.a[r][c]===vA;});
  if(killer<0)return generate(seed+1,Object.assign({},opts,{_d:depth+1}));
  const lib=buildClues(L,cells,sol,rnd,level),chosen=[];
  for(const cl of lib){chosen.push(cl);const s=solve(L,cells,chosen,S,2);if(s.length===1)break;if(s.length===0)chosen.pop();}
  if(solve(L,cells,chosen,S,2).length!==1)return generate(seed+11,Object.assign({},opts,{_d:depth+1}));
  for(let i=chosen.length-1;i>=0;i--){const tr=chosen.slice(0,i).concat(chosen.slice(i+1));if(solve(L,cells,tr,S,2).length===1)chosen.splice(i,1);}
  return {seed,level,L,cells,S,G,sol,victim,killer,clues:chosen};
}

async function api(path,opts={}){
  const h={"Content-Type":"application/json"};
  if(ACCOUNT.token)h["Authorization"]="Bearer "+ACCOUNT.token;
  let r;
  try{r=await fetch(API_BASE+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});}
  catch(e){return {ok:false,status:0,data:{error:"network"}};}
  let data={};try{data=await r.json();}catch(e){}
  if(r.status===401){saveTok(null);ACCOUNT.state=null;}
  if(data&&data.state)ACCOUNT.state=data.state;
  return {ok:r.ok, status:r.status, data};
}

   FEEDBACK
   ========================================================= */
let AC=null;
function ac(){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); return AC; }
// Som com atmosfera de mistério: dois osciladores ligeiramente desafinados,
// registo grave, ataque suave e cauda longa (sensação de incerteza/suspense).
function blip(f,dur){
  if(!S.set.som)return;
  try{
    const c=ac(), t=c.currentTime;
    const master=c.createGain(); master.gain.value=0.0001; master.connect(c.destination);
    // filtro passa-baixo para tirar o brilho e soar mais abafado/misterioso
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=Math.min(2600,f*3+400); lp.Q.value=6; lp.connect(master);
    // dois osciladores: um seno grave + um triângulo desafinado
    const o1=c.createOscillator(); o1.type="sine"; o1.frequency.value=f;
    const o2=c.createOscillator(); o2.type="triangle"; o2.frequency.value=f*1.005; // leve desafinação = tensão
    o1.connect(lp); o2.connect(lp);
    // envelope: ataque suave, decaimento longo
    const atk=Math.min(0.05,dur*0.4), peak=0.09;
    master.gain.setValueAtTime(0.0001,t);
    master.gain.exponentialRampToValueAtTime(peak,t+atk);
    master.gain.exponentialRampToValueAtTime(0.0001,t+dur*1.8);
    // ligeiro glide descendente = sensação de dúvida
    o1.frequency.setValueAtTime(f,t); o1.frequency.exponentialRampToValueAtTime(f*0.94,t+dur*1.6);
    o2.frequency.setValueAtTime(f*1.005,t); o2.frequency.exponentialRampToValueAtTime(f*0.94*1.005,t+dur*1.6);
    o1.start(t); o2.start(t);
    o1.stop(t+dur*1.9); o2.stop(t+dur*1.9);
  }catch(e){}
}
// Acorde curto (para vitória/derrota) — sequência de notas com o mesmo timbre de mistério
function chord(freqs,gap,dur){ if(!S.set.som)return; freqs.forEach((f,i)=>setTimeout(()=>blip(f,dur||0.22),i*(gap||90))); }
function buzz(ms){if(S.set.vib&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2000);}

// Aplica o idioma atual: atualiza elementos estáticos e re-renderiza o ecrã visível.
function applyLang(){
  try{ document.documentElement.setAttribute("lang", LANG); }catch(e){}
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(UI[k]) el.textContent=U(k); });

function go(id){
  screen=id;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  const el=$("scr-"+id);if(el)el.classList.add("on");
  if(id!=="board")stopTimer();else if(G&&!solved)startTimer();
  buildTabs();
  if(id==="home")renderHome();
  if(id==="stats")renderStats();
  if(id==="archive")renderArchive();
  if(id==="settings")renderSettings();
}

/* =========================================================
   NOVO CASO
   ========================================================= */
function newCase(seed,daily){
  isDaily=!!daily;
  const s=(seed==null)?((Date.now()^(caseNo*2654435761))&0x7fffffff):seed;
  G=generate(s,{level});
  G._palette=applyPalette(S.pal);
  const rnd=mulberry32(G.seed^0x9e3779b9);
  const idxs=shuffle([...Array(G.S).keys()],rnd);
  nameMap=new Array(G.S);pawnMap=new Array(G.S);
  const nm=shuffle(NAMES.slice(),rnd),pc=shuffle(PAWN_COLORS.slice(),rnd);
  for(let i=0;i<G.S;i++){nameMap[idxs[i]]=nm[i%nm.length];pawnMap[idxs[i]]=pc[i%pc.length];}
  const rnd2=mulberry32(G.seed+5);
  G._theme=pickTheme(G.seed);
  G._victimIdx=Math.floor(rnd2()*G._theme.names.length);
  G._introIdx=Math.floor(rnd2()*G._theme.intros.length);
  G._portraitSeed=idxs.map((_,i)=>((G.seed>>>0)*31+i*2654435761)>>>0);
  // Atribui um avatar distinto a cada suspeito (sem repetir no mesmo caso)
  (function(){
    const pool=Array.from({length:AVAT.length},(_,i)=>i);
    const r=mulberry32((G.seed>>>0)^0x9e3779b9);
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
    G._avatar=idxs.map((_,i)=>pool[i%pool.length]);
  })();
  placement=[];selected=null;solved=false;victimShown=false;
  hintsUsed=0;secs=0;openClue={};accusedIdx=null;
  render();
}
function startCase(seed,daily){newCase(seed,daily);go("board");startTimer();}

/* ---- Arranque de casos com validação do servidor ---- */
// Guarda se o caso atual é o diário, para o marcar como concluído na vitória.
async function beginDaily(){
  if(!authed()){openAuth();return;}
  const r=await api("/play/daily",{method:"POST"});
  if(r.status===403){toast(U("dailyClosed"));renderHome();return;}
  if(!r.ok){toast(r.status===0?U("errNetwork"):U("errStart"));return;}
  startCase(dailySeed(),true);
}
async function beginFree(){
  if(!authed()){openAuth();return;}
  const r=await api("/play/free",{method:"POST"});
  if(r.status===402){openPaywall();return;}      // limite grátis atingido
  if(!r.ok){toast(r.status===0?U("errNetwork"):U("errStart"));return;}
  startCase((Math.random()*1e9)|0,false);
}

function render(){
  $("kicker").textContent=U("caseW")+" "+caseNo+" \u00B7 "+lvlName(level)+(isDaily?" \u00B7 "+U("diario"):"");
  $("caseTitle").textContent=tr(G.L.name);
  tickClock();
  renderGrid();renderStrip();renderClues();updateBar();
}

/* célula do alvo = interseção da fila e coluna que sobram */
function leftoverCell(){
  const uR=new Set(),uC=new Set();
  placement.forEach((p,ci)=>{if(p!=null){const[r,c]=G.cells[ci];uR.add(r);uC.add(c);}});
  if(uR.size!==G.S||uC.size!==G.S)return null;
  let fr=-1,fc=-1;
  for(let r=0;r<G.G;r++)if(!uR.has(r))fr=r;
  for(let c=0;c<G.G;c++)if(!uC.has(c))fc=c;
  if(fr<0||fc<0)return null;
  return [fr,fc];
}

function renderGrid(){
  const L=G.L,grid=$("grid");grid.style.gridTemplateColumns="repeat("+L.G+",1fr)";grid.innerHTML="";
  const vic=allPlaced()?leftoverCell():null;
  for(let r=0;r<L.G;r++)for(let c=0;c<L.G;c++){
    const cell=document.createElement("div");cell.className="gcell";
    const area=L.a[r][c];
    cell.style.background="var("+ROOMVARS[area%ROOMVARS.length]+")";
    if(r===0||L.a[r-1][c]!==area)cell.classList.add("wtop");
    if(r===L.G-1||L.a[r+1][c]!==area)cell.classList.add("wbot");
    if(c===0||L.a[r][c-1]!==area)cell.classList.add("wleft");
    if(c===L.G-1||L.a[r][c+1]!==area)cell.classList.add("wright");
    const tt=L.t[r][c];
    if(tt!==".")cell.innerHTML=objSvg(tt);
    const ci=isOcc(tt)?G.cells.findIndex(x=>x[0]===r&&x[1]===c):-1;
    if(ci>=0){
      cell.classList.add("occ");cell.dataset.ci=ci;
      if(placement[ci]!=null){
        const p=placement[ci];
        const pw=document.createElement("div");pw.className="pawn";pw.style.background=pawnMap[p];pw.textContent=nameMap[p][0];
        cell.appendChild(pw);
      }
      cell.addEventListener("click",()=>onCell(ci));
    }else cell.classList.add("blocked");
    if(vic&&vic[0]===r&&vic[1]===c&&isOcc(tt)){
      cell.insertAdjacentHTML("beforeend",'<svg class="victim-mark victim-reveal" viewBox="0 0 40 40"><path d="M10 10 L30 30 M30 10 L10 30" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/></svg>');
      cell.classList.add("victim-cell");
    }
    grid.appendChild(cell);
  }
  for(const w of L.windows){
    const idx=w.r*L.G+w.c;const cell=grid.children[idx];if(!cell)continue;
    const el=document.createElement("div");
    el.className="win "+((w.side==="top"||w.side==="bottom")?"h ":"v ")+w.side;
    cell.appendChild(el);
  }
  placeRoomLabels();
}
function placeRoomLabels(){
  const L=G.L,grid=$("grid");
  grid.querySelectorAll(".roomlabel").forEach(e=>e.remove());
  for(let area=0;area<L.rooms.length;area++){
    let sr=0,sc=0,n=0,ca=[];
    for(let r=0;r<L.G;r++)for(let c=0;c<L.G;c++)if(L.a[r][c]===area){sr+=r;sc+=c;n++;ca.push([r,c]);}
    if(!n)continue;
    const cr=sr/n,cc=sc/n;let best=ca[0],bd=1e9;
    for(const[r,c]of ca){const d=(r-cr)*(r-cr)+(c-cc)*(c-cc);if(d<bd){bd=d;best=[r,c];}}
    const lab=document.createElement("div");lab.className="roomlabel";lab.textContent=tr(L.rooms[area].short);
    lab.style.left=((best[1]+0.5)/L.G*100)+"%";
    lab.style.top=((best[0]+0.85)/L.G*100)+"%";
    grid.appendChild(lab);
  }
}
function bold(t){return t.replace(/\b(ao lado|n\u00E3o|numa cadeira|num tapete|numa cama|em frente|janela|norte|sul|este|oeste|mesa|televis\u00E3o|planta|prateleira|caixa|cadeira|tapete|cama|primeira|segunda|terceira|quarta|quinta|sexta|s\u00E9tima|coluna|fila)\b/gi,m=>"<b>"+m+"</b>");}

/* ---------- tira de polaroids ---------- */
function renderStrip(){
  const box=$("strip");box.innerHTML="";
  const tilts=[-2,1.5,-1,2,-1.5,1];
  for(let p=0;p<G.S;p++){
    const el=document.createElement("div");
    el.className="pol"+(placement.includes(p)?" placed":"")+(selected===p?" active":"");
    el.style.setProperty("--tilt",tilts[p%tilts.length]+"deg");
    el.innerHTML='<div class="photo">'+avatarImg(G._avatar[p])+'</div><div class="nm">'+nameMap[p]+'</div>';
    el.onclick=()=>onSuspect(p);
    box.appendChild(el);
  }
  const v=document.createElement("div");v.className="pol victim";v.style.setProperty("--tilt","1deg");
  v.innerHTML='<div class="photo">'+targetImg(G._theme,G._victimIdx||0)+'</div>'+
    '<div class="nm">'+victimName()+'</div>';
  box.appendChild(v);
}

/* ---------- depoimentos compactos ---------- */
function renderClues(hintText){
  const box=$("clueList");box.innerHTML="";
  if(hintText){
    const h=document.createElement("div");h.className="cl hint open";
    h.innerHTML='<div class="av">!</div><div class="tx">'+bold(hintText)+'</div>';
    box.appendChild(h);
  }
  for(let p=0;p<G.S;p++){
    const ct=G.clues.filter(cl=>cl.p===p).map(cl=>bold(cl.text(nameMap))).join(" ");
    const el=document.createElement("div");
    el.className="cl"+(openClue[p]?" open":"");
    el.innerHTML='<div class="av" style="background:'+pawnMap[p]+'">'+nameMap[p][0]+'</div>'+
      '<div class="tx">'+(ct||'<i style="opacity:.7">Sem depoimento \u2014 deduz por elimina\u00E7\u00E3o.</i>')+'</div>'+
      '<div class="cv">'+(openClue[p]?"\u25BE":"\u203A")+'</div>';
    el.onclick=()=>{openClue[p]=!openClue[p];renderClues();};
    box.appendChild(el);
  }
  const v=document.createElement("div");v.className="cl vic open";
  v.innerHTML='<div class="av" style="background:'+"var(--red)"+'">\u2715</div>'+
    '<div class="tx"><span class="vtag">'+G._theme.emoji+' '+victimName()+'</span>'+(LANG==="en"?('Stays in the <b>last free cell</b>. Whoever is <b>alone in the same room</b> is '+tr(G._theme.culprit)+'.'):('Fica na <b>\u00FAltima c\u00E9lula dispon\u00EDvel</b>. Quem estiver <b>sozinho na mesma divis\u00E3o</b> \u00E9 '+tr(G._theme.culprit)+'.'))+'</div>';
  box.appendChild(v);
}

/* ---------- interação ---------- */
function onSuspect(p){
  if(solved)return;
  if(placement.includes(p)){const ci=placement.indexOf(p);delete placement[ci];selected=p;blip(320,.08);render();highlight();return;}
  selected=(selected===p)?null:p;blip(520,.05);renderStrip();highlight();
}
function highlight(){
  document.querySelectorAll(".gcell.selectable").forEach(c=>c.classList.remove("selectable"));
  if(selected==null)return;
  document.querySelectorAll(".gcell.occ").forEach(cell=>{const ci=+cell.dataset.ci;if(placement[ci]!=null)return;cell.classList.add("selectable");});
}
function onCell(ci){
  if(solved)return;
  if(placement[ci]!=null){const p=placement[ci];delete placement[ci];selected=p;blip(320,.08);render();highlight();return;}
  if(selected==null){toast("Escolhe primeiro um suspeito.");return;}
  const prev=placement.indexOf(selected);if(prev>=0)delete placement[prev];
  placement[ci]=selected;selected=null;blip(660,.07);buzz(12);render();
  if(allPlaced()&&leftoverCell())toast(U("allPlacedTarget"));
}
function currentAssign(){const a=new Array(G.S).fill(-1);placement.forEach((p,ci)=>{if(p!=null)a[p]=ci;});return a;}
function allPlaced(){return placement.filter(x=>x!=null).length===G.S;}
function updateBar(){const b=$("accuseBtn");b.disabled=!allPlaced()||solved;if(G&&G._theme)b.textContent=tr(G._theme.action);}

/* ---------- dica ---------- */
function showHint(){
  if(solved)return;
  const a=currentAssign();
  const pend=G.clues.filter(cl=>cl.test(a)!==true);
  const cl=pend[0]||G.clues[0];
  hintsUsed++;
  renderClues(cl.text(nameMap));
  $("clueList").parentElement.scrollTop=0;
  toast(U("hintW")+hintsUsed);
}

/* =========================================================
   ACUSAÇÃO E RESULTADO
   ========================================================= */
function openAccuse(){
  const a=currentAssign();
  const broke=G.clues.findIndex(c=>c.test(a)===false);
  const m=$("accModal");
  if(broke>=0){
    m.innerHTML='<h3>Algo n\u00E3o bate certo</h3><p>Um depoimento est\u00E1 a ser contrariado:</p>'+
      '<div class="cl open" style="cursor:default"><div class="av" style="background:var(--ink)">!</div><div class="tx">'+bold(G.clues[broke].text(nameMap))+'</div></div>'+
      '<div class="modal-actions"><button class="btn accuse" id="ac_x" style="flex:1">Rever</button></div>';
    $("accVeil").classList.add("on");$("ac_x").onclick=()=>$("accVeil").classList.remove("on");return;
  }
  const vic=leftoverCell();
  if(!vic||!isOcc(G.L.t[vic[0]][vic[1]])){
    m.innerHTML='<h3>O alvo n\u00E3o cabe</h3><p>A c\u00E9lula que sobra n\u00E3o pode ser ocupada. Rev\u00EA as posi\u00E7\u00F5es \u2014 o alvo tem de ficar numa c\u00E9lula dispon\u00EDvel.</p><div class="modal-actions"><button class="btn accuse" id="ac_x" style="flex:1">Rever</button></div>';
    $("accVeil").classList.add("on");$("ac_x").onclick=()=>$("accVeil").classList.remove("on");return;
  }
  const vRoom=tr(G.L.rooms[G.L.a[vic[0]][vic[1]]].short);
  let chosen=null;
  m.innerHTML='<h3>'+tr(G._theme.action)+' \u2014 '+(LANG==="en"?"who was it?":"quem foi?")+'</h3><p>'+G._theme.accuseQ(vRoom)+'</p>'+
    '<div class="pickrow" id="pg"></div>'+
    '<div class="modal-actions"><button class="btn" id="ac_c" style="flex:1">'+(LANG==="en"?"Back":"Voltar")+'</button><button class="btn accuse" id="ac_go" disabled style="flex:1.3">'+tr(G._theme.action)+'</button></div>';
  const pg=$("pg");
  for(let p=0;p<G.S;p++){
    const el=document.createElement("div");el.className="pick";
    el.innerHTML='<div class="av" style="background:'+pawnMap[p]+'">'+nameMap[p][0]+'</div><div class="nm">'+nameMap[p]+'</div>';
    el.onclick=()=>{chosen=p;pg.querySelectorAll(".pick").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");$("ac_go").disabled=false;};
    pg.appendChild(el);
  }
  $("accVeil").classList.add("on");
  $("ac_c").onclick=()=>$("accVeil").classList.remove("on");
  $("ac_go").onclick=()=>{if(chosen!=null)resolveAcc(chosen);};
}

function polMini(ai,name,tag,cls){
  return '<div class="pol '+cls+'"><div class="photo">'+avatarImg(ai)+'</div><div class="nm">'+name+'</div><div class="tag">'+tag+'</div></div>';
}
function resolveAcc(p){
  solved=true;stopTimer();accusedIdx=p;
  const correct=(p===G.killer),kn=nameMap[G.killer],m=$("accModal");
  const vicRoom=tr(G.L.rooms[G.L.a[G.cells[G.sol[G.killer]][0]][G.cells[G.sol[G.killer]][1]]].short);
  const d=today();

  if(correct){
    S.solvedCount++;S.winStreak++;caseNo++;
    if(hintsUsed===0)S.nohintRun++;else S.nohintRun=0;
    if(!S.best[level]||secs<S.best[level])S.best[level]=secs;
    if(isDaily&&S.lastDaily!==d){
      const y=key(dayOffset(-1));
      S.streak=(S.hist.some(h=>h.d===y&&h.daily&&h.ok))?(S.streak+1):1;
      S.lastDaily=d;
    }
    buzz([18,60,18]);chord([220,262,330,440],95,0.26);
  }else{
    S.failCount++;S.winStreak=0;S.nohintRun=0;
    if(isDaily)S.streak=0;
    buzz(140);chord([196,165,110],130,0.34);
  }
  S.hist.unshift({d:d,ok:correct,t:secs,level:level,name:G.L.name,killer:kn,daily:isDaily,hints:hintsUsed});
  S.hist=S.hist.slice(0,120);
  if(correct&&isDaily&&authed()){api("/play/daily/complete",{method:"POST"}).then(()=>{});}
  const got=checkAchs();
  saveStats();
  if(S.set&&S.set.auto)syncAutoLevel(); // ajusta o nível à experiência demonstrada

  const faster=Math.max(5,Math.min(97,100-Math.round(secs/((level===1?150:level===2?260:420))*55)));

  if(correct){
    m.innerHTML='<div class="stampmark ok"><span class="ring">'+U("solvedStamp")+'</span></div>'+
      '<div class="resfoto">'+polMini(G._avatar[G.killer],kn,tr(G._theme.culpTag),"guilty")+'</div>'+
      '<p style="text-align:center">'+G._theme.winLine(kn,victimName(),vicRoom)+'</p>'+
      '<div class="stats3" style="margin:0 0 12px">'+
        '<div class="stat paper"><div class="v">'+fmt(secs)+'</div><div class="l">'+U("timeW")+'</div></div>'+
        '<div class="stat paper"><div class="v">'+hintsUsed+'</div><div class="l">'+U("hintsW")+'</div></div>'+
        '<div class="stat paper"><div class="v red">'+S.streak+'</div><div class="l">'+U("sequenceW")+'</div></div>'+
      '</div>'+
      (got.length?'<div class="newach"><div class="ic">'+got[0].ic+'</div><div><div class="t">Nova conquista</div><div class="d">'+got[0].t+' \u2014 '+got[0].d+'</div></div></div>':'')+
      '<div class="card2" style="margin-bottom:2px"><div style="font-family:var(--serif);font-weight:800;font-size:12.5px;margin-bottom:7px">'+U("fasterThan")+'</div>'+
      '<div class="bar-pg" style="height:9px"><i style="width:'+faster+'%"></i></div>'+
      '<div style="font-size:11px;color:var(--ink-soft);margin-top:5px">'+faster+'% '+U("ofCasesLevel")+'</div></div>'+
      '<div class="modal-actions"><button class="btn" id="ac_st" style="flex:1">'+U("reg")+'</button><button class="btn accuse" id="ac_new" style="flex:1.4">'+U("next")+'</button></div>';
    confetti();
  }else{
    m.innerHTML='<div class="stampmark no"><span class="ring">'+U("openStamp")+'</span></div>'+
      '<div class="resfoto">'+polMini(G._avatar[p],nameMap[p],(LANG==="en"?"NAMED":"APONTADO"),"acc")+polMini(G._avatar[G.killer],kn,tr(G._theme.culpTag),"guilty")+'</div>'+
      '<p style="text-align:center">'+G._theme.loseLine(nameMap[p],kn,victimName(),vicRoom)+'</p>'+
      '<div class="card2" style="margin-bottom:2px"><div style="font-family:var(--serif);font-weight:800;font-size:12.5px;margin-bottom:7px">'+U("whereFailed")+'</div>'+
      '<div class="cl open" style="cursor:default;margin:0 0 8px"><div class="av" style="background:'+pawnMap[G.killer]+'">'+kn[0]+'</div><div class="tx">'+
      bold((G.clues.filter(c=>c.p===G.killer)[0]||G.clues[0]).text(nameMap))+'</div></div>'+
      '<div style="display:flex;gap:10px;font-size:11.5px;color:var(--ink-soft)"><span>Tempo '+fmt(secs)+'</span><span>\u00B7</span><span>'+hintsUsed+' dicas</span><span>\u00B7</span><span>Sequ\u00EAncia reposta</span></div></div>'+
      '<div class="modal-actions"><button class="btn" id="ac_see" style="flex:1">'+U("seeScene")+'</button><button class="btn accuse" id="ac_new" style="flex:1.2">'+U("newCaseW")+'</button></div>';

const LVLS=[[1,"F\u00E1cil","4\u00D74","#2d6a4f","Grelha 4\u00D74, 3 suspeitos. Pistas diretas."],
            [2,"M\u00E9dio","5\u00D75","#8a5a1f","Grelha 5\u00D75, 4 suspeitos. Nega\u00E7\u00F5es e dire\u00E7\u00F5es."],
            [3,"Dif\u00EDcil","6\u00D76","#c0392b","Grelha 5\u00D75 ou 6\u00D76, mais dedu\u00E7\u00E3o."]];
const LVLCOLS=["","#2d6a4f","#8a5a1f","#c0392b"];
// Descrições dos níveis, bilingues
const LVLDESC=[{},
  {pt:"Grelha 4\u00D74, 3 suspeitos. Pistas diretas.",en:"4\u00D74 grid, 3 suspects. Direct clues."},
  {pt:"Grelha 5\u00D75, 4 suspeitos. Nega\u00E7\u00F5es e dire\u00E7\u00F5es.",en:"5\u00D75 grid, 4 suspects. Negations and directions."},
  {pt:"Grelha 5\u00D75 ou 6\u00D76, mais dedu\u00E7\u00E3o.",en:"5\u00D75 or 6\u00D76 grid, more deduction."}];
const LVLGRID=["","4\u00D74","5\u00D75","6\u00D76"], LVLSUS=["","3","4","5"];
// Nível sugerido pela experiência de resolução: não basta acertar — pesa também
// o tempo por nível e o uso de dicas. Alguém que resolve fácil devagar, com muitas
// dicas ou a falhar acusações, ainda não está pronto para subir.
function autoLevel(){
  const solved=S.solvedCount, tot=solved+S.failCount;
  if(solved<3)return 1;
  const acc=tot?solved/tot:0;

  // Sinais dos casos resolvidos recentes (até 8), por nível
  const recentWins=S.hist.filter(h=>h.ok).slice(0,8);
  const avgHints=recentWins.length? recentWins.reduce((a,h)=>a+(h.hints||0),0)/recentWins.length : 0;
  // Tempo típico "bom" por nível (segundos); acima disto conta como lento
  const parTime={1:150,2:260,3:420};
  const cleanFast=recentWins.filter(h=>{const par=parTime[h.level]||200;return (h.hints||0)===0 && h.t>0 && h.t<=par*1.25;}).length;
  // Últimos 3 resultados (falhar seguido trava a subida)
  const last3=S.hist.slice(0,3);
  const struggling = (avgHints>=1.2) || (last3.length===3 && last3.filter(h=>!h.ok).length>=2);

  let lv=1;
  // Subir para 3: muitos casos, boa taxa de acerto, vários resultados limpos e rápidos, poucas dicas
  if(solved>=12 && acc>=.72 && cleanFast>=4 && avgHints<=0.6) lv=3;
  // Subir para 2: já com algum volume, acerto razoável, alguns casos limpos, sem depender de dicas
  else if(solved>=4 && acc>=.55 && cleanFast>=2 && avgHints<=1.0) lv=2;

  // Se está claramente a lutar (muitas dicas ou a falhar seguido), recua um nível
  if(struggling) lv=Math.max(1,lv-1);
  return lv;
}

function openAuth(mode){
  mode=mode||"login";
  const m=$("authModal");
  const tab=(id,lb,on)=>'<button class="btn'+(on?" accuse":"")+'" id="'+id+'" style="flex:1'+(on?"":";background:transparent;box-shadow:none;border-width:2px")+'">'+lb+'</button>';
  m.innerHTML=
    '<h3 style="margin-bottom:2px">'+(mode==="login"?U("login"):U("createAcc"))+'</h3>'+
    '<p style="margin-top:4px">'+U("authSaves")+'</p>'+
    '<div class="modal-actions" style="margin-bottom:10px">'+tab("au_tl",U("login"),mode==="login")+tab("au_tr",U("createAcc"),mode==="register")+'</div>'+
    '<input id="au_email" type="email" placeholder="Email" autocomplete="email" style="width:100%;padding:12px;border:2px solid var(--ink);border-radius:12px;font:inherit;margin-bottom:8px;box-sizing:border-box"/>'+
    '<input id="au_pass" type="password" placeholder="'+U("passwordPh")+'" autocomplete="current-password" style="width:100%;padding:12px;border:2px solid var(--ink);border-radius:12px;font:inherit;box-sizing:border-box"/>'+
    '<div id="au_err" style="color:var(--red);font-size:12.5px;font-weight:700;min-height:16px;margin:6px 2px"></div>'+
    '<div class="modal-actions"><button class="btn" id="au_cancel" style="flex:1">'+U("cancel")+'</button>'+
    '<button class="btn accuse" id="au_go" style="flex:1.4">'+(mode==="login"?U("login"):U("createAcc"))+'</button></div>'+
    (GOOGLE_CLIENT_ID?('<div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--ink-soft);font-size:11.5px"><div style="flex:1;height:1px;background:var(--ink);opacity:.2"></div'+(LANG==="en"?"or":"ou")+'<div style="flex:1;height:1px;background:var(--ink);opacity:.2"></div></div>'+
     '<div id="au_google" style="display:flex;justify-content:center"></div>'):'');
  $("authVeil").classList.add("on");
  if(GOOGLE_CLIENT_ID)renderGoogleButton("au_google");
  $("au_tl").onclick=()=>openAuth("login");
  $("au_tr").onclick=()=>openAuth("register");
  $("au_cancel").onclick=()=>$("authVeil").classList.remove("on");
  $("au_go").onclick=async()=>{
    const email=$("au_email").value.trim(),pass=$("au_pass").value;
    const err=$("au_err");err.textContent="";
    if(!email||!pass){err.textContent=U("fillEmailPass");return;}
    $("au_go").disabled=true;$("au_go").textContent=U("processing");
    const r=await(mode==="login"?doLogin(email,pass):doRegister(email,pass));
    $("au_go").disabled=false;$("au_go").textContent=(mode==="login"?U("login"):U("createAcc"));
    if(r.ok){$("authVeil").classList.remove("on");renderHome();toast(U("hello"));}
    else{
      const map={bad_email:U("errBadEmail"),weak_password:U("errWeakPass"),email_taken:U("errTaken"),bad_credentials:U("errBadCred"),network:U("errNetwork")};
      err.textContent=map[r.data&&r.data.error]||U("errGeneric");
    }
  };
}

/* =========================================================
   LEMBRETE DIÁRIO (o que uma PWA permite)
   Nota: sem servidor de push não há entrega garantida às 10h com a app fechada.
   Aqui pedimos permissão e, quando o utilizador ABRE a app num novo dia e ainda
   não fez o caso diário, mostramos uma notificação local (após as 10h).
   ========================================================= */
function requestReminder(){
  try{
    if(!("Notification"in window)){toast(U("notifUnsupported"));return;}
    if(Notification.permission==="granted")return;
    if(Notification.permission==="denied"){toast(U("notifDenied"));return;}
    Notification.requestPermission().then(p=>{ if(p!=="granted"){S.set.lem=false;saveStats();renderSettings();toast(U("notifDenied"));} });
  }catch(e){}
}
function maybeDailyReminder(){
  try{
    if(!S.set||!S.set.lem)return;
    if(!("Notification"in window)||Notification.permission!=="granted")return;
    const d=new Date();
    if(d.getHours()<10)return;                 // só a partir das 10h
    if(dailyDone())return;                       // já jogou hoje
    const k=today();
    if(S._lastNotif===k)return;                  // já avisámos hoje
    S._lastNotif=k; saveStats();
    const title=LANG==="en"?"Mysterioku":"Mysterioku";
    const body=LANG==="en"?"Today's case is waiting. Can you crack it?":"O caso de hoje está à tua espera. Consegues resolvê-lo?";
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{ try{reg.showNotification(title,{body,tag:"myst-daily"});}catch(e){ new Notification(title,{body}); } }).catch(()=>{ try{new Notification(title,{body});}catch(e){} });
    }else{ try{new Notification(title,{body}); }catch(e){} }
  }catch(e){}
}

buildTabs();

go("home");
setTimeout(maybeDailyReminder,1500);

/* Conta: sincroniza estado ao arrancar e trata o regresso do Stripe */
(async function initAccount(){
  const params=new URLSearchParams(location.search);
  if(authed()){await refreshState();renderHome();}
  if(params.get("checkout")==="success"){
    // O webhook pode demorar 1-2s; tenta atualizar algumas vezes.
    let tries=0;const poll=async()=>{await refreshState();renderHome();
      if(premium()||tries>=5){toast(premium()?"Premium ativo. Bom jogo!":"Pagamento recebido \u2014 a confirmar\u2026");}
      else{tries++;setTimeout(poll,1500);}};
    poll();
    history.replaceState({},"",location.pathname);
  }else if(params.get("checkout")==="cancel"){
    history.replaceState({},"",location.pathname);
  }
})();

/* PWA */
if("serviceWorker"in navigator){
  const sw=`const C="mysterioku-v1";
self.addEventListener("install",e=>self.skipWaiting());
self.addEventListener("activate",e=>e.waitUntil((async()=>{const ks=await caches.keys();await Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)));await clients.claim();})()));
self.addEventListener("fetch",e=>{
  const req=e.request;
  if(req.method!=="GET")return;
  const nav=req.mode==="navigate"||(req.headers.get("accept")||"").indexOf("text/html")>=0;
  if(nav){ // rede primeiro: uma atualizacao publicada chega sempre
    e.respondWith(fetch(req).then(r=>{const cp=r.clone();caches.open(C).then(c=>{try{c.put(req,cp)}catch(_){}});return r;}).catch(()=>caches.match(req).then(r=>r||caches.match("./"))));
    return;
  }
  e.respondWith(caches.match(req).then(r=>r||fetch(req).then(resp=>{const cp=resp.clone();caches.open(C).then(c=>{try{c.put(req,cp)}catch(_){}});return resp;})));
});`;
  try{const u=URL.createObjectURL(new Blob([sw],{type:"text/javascript"}));navigator.serviceWorker.register(u).catch(()=>{});}catch(e){}
}
